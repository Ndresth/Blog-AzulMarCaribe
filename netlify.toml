# La función solo se necesita en las páginas de noticias (antes corría en TODAS las rutas, incluidos JS/CSS/imágenes)
[[edge_functions]]
  function = "inject-meta"
  path = "/post/*"

# sitemap.xml y rss.xml se generan desde Firestore (caché de 1 h en la CDN)
[[edge_functions]]
  function = "feeds"
  path = "/sitemap.xml"

[[edge_functions]]
  function = "feeds"
  path = "/rss.xml"

# Los assets de Vite llevan hash en el nombre: se pueden cachear 1 año
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
